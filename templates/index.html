<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelfHoster - Deploy Anything</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .inputs {
            display: flex;
            gap: 1rem;
        }

        input[type="text"] {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 0.75rem 1.25rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #repo-url {
            flex: 2;
        }

        #entry-point {
            flex: 1;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .project-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.25rem;
            text-align: center;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .project-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            transform: scale(1.02);
        }

        .project-icon {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            display: block;
        }

        .project-name {
            font-weight: 600;
            font-size: 1rem;
        }

        #status-msg {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            display: none;
        }

        .status-success {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>SelfHoster</h1>
            <p class="subtitle">Deploy your GitHub projects instantly</p>
        </header>

        <section class="card">
            <h2>Clone New Project</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Enter a GitHub repository URL to host it locally.
            </p>
            <div class="input-group">
                <div class="inputs">
                    <input type="text" id="repo-url" placeholder="https://github.com/username/repository"
                        spellcheck="false">
                    <input type="text" id="entry-point" placeholder="Main file (e.g. app.py)" value="app.py"
                        spellcheck="false">
                </div>
                <button id="clone-btn">
                    <div class="btn-content">
                        <div class="loader" id="loader"></div>
                        <span id="btn-text">Clone Project</span>
                    </div>
                </button>
            </div>
            <div id="status-msg"></div>
        </section>

        <section>
            <h2 style="margin-bottom: 1.5rem;">Deployed Projects</h2>
            <div class="project-list" id="project-list">
                {% for project in projects %}
                <a href="/{{ project.name }}/" class="project-card">
                    <span class="project-icon">📦</span>
                    <span class="project-name">{{ project.name }}</span>
                    <span style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-top: 0.3rem;">
                        Entry: {{ project.entry_point }}.py
                    </span>
                </a>
                {% else %}
                <p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 2rem;">
                    No projects deployed yet.
                </p>
                {% endfor %}
            </div>
        </section>
    </div>

    <script>
        const cloneBtn = document.getElementById('clone-btn');
        const repoUrlInput = document.getElementById('repo-url');
        const entryPointInput = document.getElementById('entry-point');
        const statusMsg = document.getElementById('status-msg');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btn-text');
        const projectList = document.getElementById('project-list');

        cloneBtn.addEventListener('click', async () => {
            const repoUrl = repoUrlInput.value.trim();
            const entryPoint = entryPointInput.value.trim() || 'app.py';
            if (!repoUrl) return;

            // UI Loading state
            cloneBtn.disabled = true;
            loader.style.display = 'block';
            btnText.innerText = 'Cloning...';
            statusMsg.style.display = 'none';

            try {
                const response = await fetch('/clone-project', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        repo_url: repoUrl,
                        entry_point: entryPoint
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    statusMsg.innerText = `✅ ${data.message}`;
                    statusMsg.className = 'status-success';
                    statusMsg.style.display = 'block';

                    // Add to list if not already there
                    setTimeout(() => location.reload(), 1500);
                } else {
                    statusMsg.innerText = `❌ ${data.error || 'Failed to clone repo'}`;
                    statusMsg.className = 'status-error';
                    statusMsg.style.display = 'block';
                }
            } catch (err) {
                statusMsg.innerText = '❌ Network error occurred';
                statusMsg.className = 'status-error';
                statusMsg.style.display = 'block';
            } finally {
                cloneBtn.disabled = false;
                loader.style.display = 'none';
                btnText.innerText = 'Clone Project';
            }
        });

        // Enter key support
        repoUrlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') cloneBtn.click();
        });
    </script>
</body>

</html>
